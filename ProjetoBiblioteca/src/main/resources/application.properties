# URL de conexão: altera "nome_do_seu_banco" para o nome da database criada no PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/biblioteca
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL executadas no console (útil para estudar/desenvolver)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
